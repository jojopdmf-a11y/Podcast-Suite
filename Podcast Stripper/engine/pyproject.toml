[project]
name = "podcast-stripper"
version = "0.1.0"
description = "Split a mixed podcast into one aligned audio track per speaker."
requires-python = ">=3.11"
dependencies = [
    "imageio-ffmpeg>=0.6.0",
    "numpy>=2.0",
    "pyannote.audio>=4.0.7",
    "demucs>=4.0.1",
]

[project.scripts]
podcast-stripper = "podcast_stripper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["podcast_stripper"]

[tool.uv]
package = true

[dependency-groups]
dev = ["pytest>=8.3"]
